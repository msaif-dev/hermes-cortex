apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hermes-mcp-network-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hermes-mcp-agent
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow Prometheus scraper to fetch metrics on port 9090
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9090
  egress:
    # Allow outbound connections to PostgreSQL warehouse (port 5432)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - protocol: TCP
          port: 5432
    # Allow outbound connections to Redis cache (port 6379)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports:
        - protocol: TCP
          port: 6379
    # Allow outbound connections to Qdrant vector database (port 6333)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: qdrant
      ports:
        - protocol: TCP
          port: 6333
    # Allow HTTPS outbound for Slack Bolt Socket Mode (port 443) and DNS (port 53)
    - ports:
        - protocol: TCP
          port: 443
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
