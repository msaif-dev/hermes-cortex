apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-mcp-agent
  labels:
    app.kubernetes.io/name: hermes-mcp-agent
    app.kubernetes.io/part-of: hermes-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes-mcp-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes-mcp-agent
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: agent
          image: hermes-mcp:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          envFrom:
            - secretRef:
                name: hermes-secrets
            - configMapRef:
                name: hermes-config
          ports:
            - containerPort: 9090
              name: metrics
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 20
