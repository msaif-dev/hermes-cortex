# Docker Compose for local development
services:
  # PostgreSQL Database
  postgres:
    image: postgres:17-alpine
    pull_policy: if_not_present
    environment:
      POSTGRES_DB: hermes
      POSTGRES_USER: hermes_admin
      POSTGRES_PASSWORD: dev_password_change_me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hermes_admin -d hermes"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (for semantic caching using local Valkey 8.1 drop-in)
  redis:
    image: valkey/valkey:8.1-alpine
    pull_policy: if_not_present
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Qdrant (vector database for memory)
  qdrant:
    image: qdrant/qdrant:v1.19.0
    pull_policy: if_not_present
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data:
